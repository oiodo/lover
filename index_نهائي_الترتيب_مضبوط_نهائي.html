<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>أحبك 💗</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:auto}
body{display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffe0eb,#fff2f7,#ffd4e3)}
.card{position:relative;z-index:2;text-align:center;width:min(90vw,520px);padding:32px 24px 36px;background:rgba(255,255,255,.68);border:2px solid #fff;border-radius:34px;box-shadow:0 18px 60px rgba(160,55,100,.22)}
h1{margin:0 0 5px;font-size:clamp(58px,14vw,100px);line-height:1;color:#e34f86;text-shadow:0 4px #fff}
p{margin:0 0 22px;font-size:clamp(20px,5vw,28px);color:#8b3158}
.photo{width:min(72vw,330px);height:min(72vw,330px);object-fit:cover;border-radius:24px;border:8px solid white;box-shadow:0 12px 35px rgba(150,50,100,.25)}
.song{margin:20px auto 0;padding:12px 16px;border-radius:20px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;gap:12px;max-width:330px;color:#7d294f}
.play{width:52px;height:52px;border:0;border-radius:50%;background:#e34f86;color:#fff;font-size:28px;line-height:52px;cursor:pointer;box-shadow:0 6px 18px rgba(180,50,100,.25)}
.song-title{font-size:18px;font-weight:bold}.song-artist{font-size:14px;opacity:.75;margin-top:2px}
.heart{position:fixed;bottom:-60px;left:var(--x);font-size:var(--s);animation:fly var(--d) linear infinite;animation-delay:var(--delay);z-index:1}
@keyframes fly{0%{transform:translateY(0);opacity:0}12%{opacity:.95}50%{transform:translateY(-55vh) translateX(35px) rotate(18deg)}100%{transform:translateY(-115vh) translateX(-40px) rotate(-18deg);opacity:0}}
</style>
<style>
.card{width:min(96vw,1100px);padding:30px 30px 34px}
.top-song{width:100%;display:flex;justify-content:center;margin:8px auto 26px}
.top-song .song-side{width:100%;display:flex;justify-content:center}
.top-song .song{margin:0 auto;max-width:390px}
.content-grid{display:grid;grid-template-columns:minmax(190px,260px) minmax(280px,380px);grid-template-areas:"love photo";align-items:center;justify-content:center;gap:12px;margin-top:0;direction:ltr}
.love-side{grid-area:love;direction:rtl}
.photo-side{grid-area:photo;direction:rtl}
.photo-side .photo{display:block;margin:0 auto;width:min(34vw,350px);height:min(34vw,350px)}
.love-side .love-meter{margin:0 auto;max-width:260px}
.proposal-below{display:flex;justify-content:center;margin:22px auto 0}
.proposal-below .proposal-box{margin:0 auto}
@media (max-width:800px){
  body{overflow:auto;min-height:100vh;padding:20px 0}
  .card{width:min(94vw,600px);padding:26px 18px 30px}
  .top-song{margin-bottom:20px}
  .content-grid{grid-template-columns:1fr;grid-template-areas:"photo" "love";gap:14px}
  .photo-side .photo{width:min(70vw,330px);height:min(70vw,330px)}
  .proposal-below{margin-top:18px}
}
</style>
<style>
/* Final layout: song above photo, love meter beside photo, proposal and letter below */
.content-grid{display:grid;grid-template-columns:minmax(190px,260px) minmax(280px,380px);grid-template-areas:"love photo";align-items:center;justify-content:center;gap:12px;margin-top:0;direction:ltr}
.love-side{grid-area:love;direction:rtl}
.photo-side{grid-area:photo;direction:rtl}
.photo-side .photo{display:block;margin:0 auto;width:min(34vw,350px);height:min(34vw,350px)}
.love-side .love-meter{margin:0 auto;max-width:260px}
.proposal-below{display:flex;justify-content:center;margin:22px auto 0}
.proposal-below .proposal-box{margin:0 auto}
@media(max-width:800px){
  .content-grid{grid-template-columns:1fr;grid-template-areas:"photo" "love";gap:14px}
  .photo-side .photo{width:min(70vw,330px);height:min(70vw,330px)}
  .proposal-below{margin-top:18px}
}
</style>
<style>
/* ترتيب الصفحة النهائي: الأغنية فوق، ثم الصورة والحب جنب بعض، ثم الزواج، ثم الرسالة */
.top-song{width:100%;display:flex;justify-content:center;margin:8px auto 24px}
.top-song .song-side{width:100%;display:flex;justify-content:center;align-items:center}
.content-grid{display:grid !important;grid-template-columns:minmax(180px,260px) minmax(280px,350px) !important;grid-template-areas:"love photo" !important;align-items:center;justify-content:center;gap:10px !important;margin:0 auto !important;direction:ltr}
.love-side{grid-area:love !important;direction:rtl}
.photo-side{grid-area:photo !important;direction:rtl}
.photo-side .photo{display:block;margin:0 auto;width:min(34vw,350px);height:min(34vw,350px)}
.proposal-below{display:flex !important;justify-content:center !important;margin:22px auto 0 !important}
.proposal-below .proposal-box{margin:0 auto}
.love-letter{margin-top:24px !important}
@media(max-width:800px){
  .content-grid{grid-template-columns:1fr !important;grid-template-areas:"photo" "love" !important;gap:14px !important}
  .photo-side .photo{width:min(72vw,330px);height:min(72vw,330px)}
  .proposal-below{margin-top:18px !important}
  .love-letter{margin-top:20px !important}
}
</style>
<style>
/* FINAL: all sections stacked vertically; only photo + love meter share one row */
.card{width:min(94vw,760px)!important;display:flex!important;flex-direction:column!important;align-items:center!important}
.top-song{width:100%!important;display:flex!important;justify-content:center!important;margin:8px auto 24px!important}
.top-song .song-side{width:100%!important;display:flex!important;justify-content:center!important;align-items:center!important}

</style>
<style>
/* FINAL FIX: one vertical column on desktop and mobile */
body{display:block!important;min-height:100vh!important;overflow-x:hidden!important;overflow-y:auto!important;padding:24px 0!important}
.card{width:min(94vw,760px)!important;margin:0 auto!important;display:flex!important;flex-direction:column!important;align-items:center!important}

.proposal-below{width:100%!important;display:flex!important;justify-content:center!important;margin:24px auto 0!important}
.love-letter{width:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;margin:24px auto 0!important}
@media(max-width:800px){
 .card{width:min(94vw,600px)!important}
 .content-grid{grid-template-columns:1fr!important;grid-template-areas:"photo" "love"!important;gap:14px!important}

<script>
(function(){
  const area=document.getElementById('proposalArea');
  const no=document.getElementById('proposalNo');
  const yes=document.getElementById('proposalYes');
  const answer=document.getElementById('proposalAnswer');
  if(!area||!no||!yes||!answer)return;
  function escapeNo(e){
    if(e){e.preventDefault();e.stopPropagation();}
    no.style.position='absolute';
    const pad=10;
    const maxX=Math.max(pad,area.clientWidth-no.offsetWidth-pad);
    const maxY=Math.max(pad,area.clientHeight-no.offsetHeight-pad);
    no.style.left=(pad+Math.random()*Math.max(1,maxX-pad))+'px';
    no.style.top=(pad+Math.random()*Math.max(1,maxY-pad))+'px';
  }
  no.addEventListener('mouseenter',escapeNo);
  no.addEventListener('pointerdown',escapeNo);
  no.addEventListener('click',escapeNo);
  yes.addEventListener('click',function(){
    answer.textContent='عرفت إنك بتقول اي';
    yes.textContent='اي';
  });
})();
</script>
<script>
const loveRange = document.getElementById('loveRange');
const fullHeart = document.getElementById('fullHeart');
const lovePercent = document.getElementById('lovePercent');
const loveMessage = document.getElementById('loveMessage');

function updateLove(){
  const value = Number(loveRange.value);
  fullHeart.style.clipPath = `inset(${100-value}% 0 0 0)`;
  lovePercent.textContent = value + '%';

  if(value < 25) loveMessage.textContent = 'ها بس هيك؟؟';
  else if(value < 60) loveMessage.textContent = 'كمل كمل!!';
  else if(value < 100) loveMessage.textContent = 'كمل ولا بعضك';
  else loveMessage.textContent = 'Good Boy';
}
loveRange.addEventListener('input', updateLove);
updateLove();

</script>

<script>
const openLetter = document.getElementById('openLetter');
const letterOverlay = document.getElementById('letterOverlay');
const closeLetter = document.getElementById('closeLetter');

function showLetter(){
  letterOverlay.classList.add('open');
  letterOverlay.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function hideLetter(){
  letterOverlay.classList.remove('open');
  letterOverlay.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
openLetter.addEventListener('click', showLetter);
closeLetter.addEventListener('click', hideLetter);
letterOverlay.addEventListener('click', (e)=>{
  if(e.target === letterOverlay) hideLetter();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && letterOverlay.classList.contains('open')) hideLetter();
});
</script>
